name: quality

on: [push, pull_request]

permissions: {}

# A new push to a pull request makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"

jobs:
  lock:
    name: lockfile is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv lock --check

  lint:
    name: black, isort, pylint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv run black --check avenir_mcp tests evals docsgen
      - run: uv run isort --check avenir_mcp tests evals docsgen
      - run: uv run pylint avenir_mcp tests evals docsgen

  changelog:
    name: changelog matches the history
    # Only on a tag. A commit cannot contain its own changelog entry, so on an
    # ordinary push the file is always one commit behind and the check would
    # force an --amend on every commit. What must be true is narrower: the
    # changelog of a released version is exactly that version's history.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git-cliff reads the whole history, not the default shallow clone.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # A generated changelog only stays honest if something fails when it is
      # not what the history produces.
      - run: uvx git-cliff -o expected.md
      - run: diff -u CHANGELOG.md expected.md

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv run mypy

  tests:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # avenir-mcp runs on its users' machines: Linux and macOS are required.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          # Windows is required too. POSIX-only checks (file permissions) are
          # skipped there, so coverage is enforced on Linux and macOS only.
          - os: windows-latest
            python-version: "3.14"
            experimental: false
            coverage: "--cov-fail-under=0"
          # 3.15 is a release candidate, and beartype (via fastmcp) does not import
          # on it yet. Run it to learn when that changes, without blocking.
          - os: ubuntu-latest
            python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # The suite never calls YNAB: no token is needed, and none is available here.
      - run: uv run pytest ${{ matrix.coverage }}

  vocabulary:
    name: lexdrift against its baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # A new verb for an idea already named fails; accepted drift lives in lexdrift.lock.
      - run: uvx lexdrift check avenir_mcp --baseline lexdrift.lock

  hygiene:
    name: typos and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx typos .
      - run: uvx zizmor --persona=regular .github/workflows/

  audit:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # The server holds a token with write access to people's budgets: a
      # vulnerable dependency is a vulnerable budget.
      - run: uv export --frozen --no-emit-project --all-groups -o requirements.txt
      - run: uvx pip-audit --strict --disable-pip -r requirements.txt

  passed:
    name: CI passed
    # The one check branch protection requires: it stands for every job above.
    if: always()
    needs: [lock, lint, types, tests, vocabulary, hygiene, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done
