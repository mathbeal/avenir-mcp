# SPDX-License-Identifier: MIT

[project]
name = "avenir-mcp"
dynamic = ["version"]
description = "Unofficial MCP server for YNAB: budgets, spending and transaction classification, built for agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathieu Beal" }]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "ynab",
    "you-need-a-budget",
    "budget",
    "budgeting",
    "personal-finance",
    "agents",
    "claude",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==4.0.9",
    "httpx>=0.28.1,<1",
    # Already required by fastmcp; declared because tool arguments, results and
    # journal entries are pydantic models, whose field docstrings become the
    # descriptions agents read.
    "pydantic>=2.13,<3",
    # Imported directly, though fastmcp brings them: declared so that a change in
    # fastmcp's own dependencies cannot remove them unnoticed. deptry checks it.
    "mcp>=2.2.0,<3",
    "mcp-types>=2.2.0,<3",
    "starlette>=1.7.0,<2",
]

[project.urls]
Homepage = "https://github.com/mathbeal/avenir-mcp"
Documentation = "https://avenir-mcp.pages.dev/avenir-mcp/"
Repository = "https://github.com/mathbeal/avenir-mcp"
Issues = "https://github.com/mathbeal/avenir-mcp/issues"
Changelog = "https://github.com/mathbeal/avenir-mcp/blob/main/CHANGELOG.md"

[project.scripts]
avenir-mcp = "avenir_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "pylint==4.0.9",
    "ruff==0.16.9",
    "deptry==0.25.1",
    "hypothesis==6.168.3",
    "mutmut==3.8.0",
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20260906",
    "pytest-benchmark==5.3.0",
]

# hatchling builds the same wheel and sdist twice from the same commit: files in a fixed
# order, every date set to SOURCE_DATE_EPOCH, no user or group name, and the same gzip
# header. Pinned, so that a release can be rebuilt with the backend that built it.
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "avenir_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["avenir_mcp"]

# The package and its tests, as before; the documentation, evaluations and tooling stay
# in the repository.
[tool.hatch.build.targets.sdist]
include = ["/avenir_mcp", "/tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["avenir_mcp", "tests", "evals", "docsgen", "benchmarks"]

# Docstrings in Google style, complete: every argument, return value and exception.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# D, DOC: Google docstrings. I: sorted imports. S: bandit's security checks.
select = ["D", "DOC", "I", "S"]
# A Raises section may name what a called function raises: the caller needs it too.
ignore = ["DOC502"]
# The DOC rules (pydoclint) are still in preview.
preview = true

[tool.ruff.lint.per-file-ignores]
# Every function has a docstring, tests included: a test says the behaviour it checks.
# Args/Returns/Raises sections are required in the package only. Tests assert, and use
# made-up tokens.
"tests/**" = ["DOC", "S101", "S105", "S106"]
"evals/**" = ["DOC"]
"docsgen/**" = ["DOC"]
# Benchmarks assert what they timed, on a seeded (not cryptographic) random plan.
"benchmarks/**" = ["DOC", "S101", "S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Run with `uvx` (just lint, CI), not installed: pydoclint needs a fork of docstring_parser
# that takes the place of the one fastmcp needs.
# What ruff's DOC rules do not check yet: arguments in the signature's order, no type in
# a docstring (the annotation is the only one), and a summary-only docstring checked too.
# Raises stay with ruff (DOC502 is ignored on purpose); model fields are checked through
# the tools' schemas (tests/test_protocol.py).
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-raises = true
check-class-attributes = false
allow-init-docstring = true
skip-checking-short-docstrings = false

[tool.pylint.format]
max-line-length = 100

# A suppression that silences nothing hides the next real finding at that line: refused.
[tool.pylint."messages control"]
enable = ["useless-suppression"]

[tool.pylint.main]
fail-on = ["useless-suppression"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "ynab_terms: a rule of YNAB's API terms that the self-checked badge promises",
]
addopts = "--strict-markers --strict-config --cov=avenir_mcp --cov-branch --cov-report=term-missing --cov-fail-under=100"

# docsgen is a development tool, not in the package (only avenir_mcp ships): it may use
# the development dependency pyyaml, to read YNAB's specification. The benchmarks, likewise,
# use pytest-benchmark.
[tool.deptry.per_rule_ignores]
DEP004 = ["yaml", "pytest_benchmark"]

# Mutation testing (`just mutate`): the modules that compute, against their own tests.
[tool.mutmut]
paths_to_mutate = ["avenir_mcp/"]
do_not_mutate = [
    "avenir_mcp/__init__.py",
    "avenir_mcp/__main__.py",
    "avenir_mcp/amounts.py",
    "avenir_mcp/app.py",
    "avenir_mcp/client.py",
    "avenir_mcp/confirm.py",
    "avenir_mcp/context.py",
    "avenir_mcp/http_auth.py",
    "avenir_mcp/journal.py",
    "avenir_mcp/logs.py",
    "avenir_mcp/model.py",
    "avenir_mcp/server.py",
    "avenir_mcp/tools_*.py",
]
also_copy = ["evals/"]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
tests_dir = [
    "tests/test_analytics.py",
    "tests/test_classifier.py",
    "tests/test_forecast.py",
    "tests/test_properties.py",
    "tests/test_reconcile.py",
    "tests/test_text.py",
    "tests/test_triage.py",
    "tests/test_writes.py",
]

[tool.coverage.run]
omit = ["avenir_mcp/__main__.py"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
