name: quality

# On a pull request, and on main once merged; a push to a pull request's branch
# alone would run everything a second time.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A new push to a pull request makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"

jobs:
  lock:
    name: lockfile is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv lock --check

  lint:
    name: ruff, pylint, deptry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv run ruff format --check avenir_mcp tests evals docsgen benchmarks
      - run: uv run pylint avenir_mcp tests evals docsgen benchmarks
      - run: uv run ruff check avenir_mcp tests evals docsgen benchmarks
      - run: uv run deptry .

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv run mypy
      # Each benchmark once, untimed: they keep working without slowing CI down.
      - run: uv run pytest benchmarks -o addopts="" -p no:cacheprovider --benchmark-disable

  tests:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # avenir-mcp runs on its users' machines: Linux and macOS are required.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        experimental: [false]
        # A macOS runner costs ten Linux ones: a pull request tries the newest Python
        # there; main tries them all.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'none' }}
            python-version: "3.12"
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'none' }}
            python-version: "3.13"
        include:
          # Windows is required too. POSIX-only checks (file permissions) are
          # skipped there, so coverage is enforced on Linux and macOS only.
          - os: windows-latest
            python-version: "3.14"
            experimental: false
            coverage: "--cov-fail-under=0"
          # 3.15 is a release candidate, and beartype (via fastmcp) does not import
          # on it yet. Run it to learn when that changes: a failure is a warning on
          # the run, not a red check on every pull request.
          - os: ubuntu-latest
            python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # The suite never calls YNAB: no token is needed, and none is available here.
      - id: pytest
        run: uv run pytest ${{ matrix.coverage }}
        continue-on-error: ${{ matrix.experimental }}
      - if: steps.pytest.outcome == 'failure'
        env:
          PYTHON: ${{ matrix.python-version }}
        run: echo "::warning::The tests fail on Python $PYTHON, which is still experimental."

  vocabulary:
    name: lexdrift against its baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # A new verb for an idea already named fails; accepted drift lives in lexdrift.lock.
      - run: uvx lexdrift check avenir_mcp --baseline lexdrift.lock

  hygiene:
    name: typos and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx typos .
      - run: uvx zizmor --persona=regular .github/workflows/

  audit:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # The server holds a token with write access to people's budgets: a
      # vulnerable dependency is a vulnerable budget.
      - run: uv export --frozen --no-emit-project --all-groups -o requirements.txt
      - run: uvx pip-audit --strict --disable-pip -r requirements.txt

  secrets:
    name: no secret in the history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the code is all a job needs; a private repository cannot be cloned without it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not only the last one: a secret removed later is still published.
          fetch-depth: 0
      # gitleaks 8.30.1, pinned by digest. --redact keeps a found secret out of the log.
      - run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --log-opts=--all

  passed:
    name: CI passed
    # The one check branch protection requires: it stands for every job above.
    if: always()
    needs: [lock, lint, types, tests, vocabulary, hygiene, audit, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done
