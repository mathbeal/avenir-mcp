[project]
name = "avenir-mcp"
dynamic = ["version"]
description = "An MCP server for YNAB: budgets, spending and transaction classification, built for agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathieu Beal" }]
requires-python = ">=3.14"
keywords = ["mcp", "model-context-protocol", "ynab", "budget", "personal-finance", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==4.0.9",
    "httpx>=0.28.1",
]

[project.urls]
Repository = "https://github.com/mathbeal/avenir-mcp"
Issues = "https://github.com/mathbeal/avenir-mcp/issues"

[project.scripts]
avenir-mcp = "avenir_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "isort==9.0.1",
    "mypy==2.3.1",
    "pylint==4.0.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["avenir_mcp"]

[tool.setuptools.dynamic]
version = { attr = "avenir_mcp.__version__" }

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
strict = true
python_version = "3.14"
files = ["avenir_mcp", "tests", "evals"]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
addopts = "--strict-markers --strict-config --cov=avenir_mcp --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = ["avenir_mcp/__main__.py"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
