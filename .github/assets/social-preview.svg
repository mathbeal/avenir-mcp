<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="title">avenir-mcp, an unofficial MCP server for YNAB</title><desc id="desc">Asked whether they will run short before payday, the agent calls forecast_balance and answers no: the lowest day is 3,928, then the balance climbs every month. Behind the answer, the projected balance of the invented demo plan rises toward a rising sun: 3,928 now, 6,482, 7,876 and 9,670 three months ahead.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#042f2e"/><stop offset=".55" stop-color="#0f766e"/><stop offset=".95" stop-color="#fbbf24"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fde68a" stop-opacity=".55"/><stop offset=".3" stop-color="#fcd34d" stop-opacity=".28"/><stop offset=".6" stop-color="#fbbf24" stop-opacity=".1"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><rect width="1280" height="640" fill="url(#bg)"/><g fill="#fff" opacity=".6"><circle cx="700" cy="60" r="2"/><circle cx="1180" cy="70" r="2"/><circle cx="880" cy="45" r="1.5"/><circle cx="560" cy="110" r="1.5"/></g><circle cx="1010" cy="305" r="440" fill="url(#glow)" filter="url(#blur)"/><g stroke="#fde68a" stroke-width="12" stroke-linecap="round"><path d="M1132 305L1170 305"/><path d="M1116 366L1149 385"/><path d="M904 366L871 385"/><path d="M888 305L850 305"/><path d="M904 244L871 225"/><path d="M949 199L930 166"/><path d="M1010 183L1010 145"/><path d="M1071 199L1090 166"/><path d="M1116 244L1149 225"/></g><circle cx="1010" cy="305" r="100" fill="url(#sun)"/><path d="M0 553 C42 548, 157 532, 250 520 C343 508, 457 495, 560 480 C663 465, 775 450, 870 430 C965 410, 1062 377, 1130 360 C1198 343, 1255 332, 1280 327 L1280 640 L0 640Z" fill="#042f2e"/><path d="M0 553 C42 548, 157 532, 250 520 C343 508, 457 495, 560 480 C663 465, 775 450, 870 430 C965 410, 1062 377, 1130 360 C1198 343, 1255 332, 1280 327" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/><circle cx="250" cy="520" r="9" fill="#fde68a"/><text x="250" y="558" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3,928</text><text x="250" y="582" text-anchor="middle" font-size="16" fill="#99f6e4">now</text><circle cx="560" cy="480" r="9" fill="#fde68a"/><text x="560" y="518" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">6,482</text><text x="560" y="542" text-anchor="middle" font-size="16" fill="#99f6e4">+1 month</text><circle cx="870" cy="430" r="9" fill="#fde68a"/><text x="870" y="468" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">7,876</text><text x="870" y="492" text-anchor="middle" font-size="16" fill="#99f6e4">+2 months</text><circle cx="1130" cy="360" r="9" fill="#fde68a"/><text x="1130" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">9,670</text><text x="1130" y="422" text-anchor="middle" font-size="16" fill="#99f6e4">+3 months</text><text x="80" y="140" font-size="88" font-weight="700" fill="#fff" letter-spacing="-2">avenir-mcp</text>
<text x="84" y="190" font-size="28" font-weight="500" fill="#fde68a">An unofficial MCP server for YNAB</text><rect x="80" y="230" width="640" height="190" rx="14" fill="#042f2e" fill-opacity="0.85" stroke="#ffffff30"/>
<g><circle cx="106" cy="254" r="6" fill="#ff5f56"/><circle cx="126" cy="254" r="6" fill="#ffbd2e"/><circle cx="146" cy="254" r="6" fill="#27c93f"/></g>
<g font-family="'SF Mono', Menlo, Monaco, monospace" font-size="19">
<text x="106" y="302" fill="#d2a8ff">you   <tspan fill="#e6edf3">Will I run short before payday?</tspan></text>
<text x="106" y="336" fill="#8b949e">  ⎿ forecast_balance(months=3)</text>
<text x="106" y="370" fill="#7ee787">agent <tspan fill="#e6edf3">No. Your lowest day is 3,928,</tspan></text>
<text x="106" y="398" fill="#e6edf3">      then the balance climbs every month.</text></g></svg>