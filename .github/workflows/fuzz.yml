name: Fuzz

# Every night, the Hypothesis properties of tests/test_properties.py with 200,000
# examples each instead of 100: bank labels, damaged journals, HTTP headers, amounts,
# cursors. A failure prints the smallest input that breaks the property; run
# `just fuzz` locally to reproduce it, then add it as a test.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

env:
  UV_FROZEN: "1"

jobs:
  fuzz:
    name: Fuzz the properties
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv run pytest tests/test_properties.py -o addopts="" -p no:cacheprovider --hypothesis-profile=fuzz
        env:
          AVENIR_MCP_FUZZ_EXAMPLES: "200000"
