[project]
name = "avenir-mcp"
dynamic = ["version"]
description = "An unofficial MCP server for YNAB: budgets, spending and transaction classification, built for agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathieu Beal" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "ynab", "budget", "personal-finance", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==4.0.9",
    "httpx>=0.28.1,<1",
    # Already required by fastmcp; declared because tool arguments, results and
    # journal entries are pydantic models, whose field docstrings become the
    # descriptions agents read.
    "pydantic>=2.13,<3",
    # Imported directly, though fastmcp brings them: declared so that a change in
    # fastmcp's own dependencies cannot remove them unnoticed. deptry checks it.
    "mcp>=2.2.0,<3",
    "mcp-types>=2.2.0,<3",
    "starlette>=1.7.0,<2",
]

[project.urls]
Homepage = "https://github.com/mathbeal/avenir-mcp"
Documentation = "https://mathbeal.github.io/avenir-mcp/"
Repository = "https://github.com/mathbeal/avenir-mcp"
Issues = "https://github.com/mathbeal/avenir-mcp/issues"
Changelog = "https://github.com/mathbeal/avenir-mcp/blob/main/CHANGELOG.md"

[project.scripts]
avenir-mcp = "avenir_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "pylint==4.0.9",
    "ruff==0.16.9",
    "deptry==0.25.1",
    "hypothesis==6.168.1",
    "mutmut==3.8.0",
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["avenir_mcp"]

[tool.setuptools.dynamic]
version = { attr = "avenir_mcp.__version__" }

[tool.mypy]
strict = true
python_version = "3.12"
files = ["avenir_mcp", "tests", "evals", "docsgen"]

# Docstrings in Google style, complete: every argument, return value and exception.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# D, DOC: Google docstrings. I: sorted imports. S: bandit's security checks.
select = ["D", "DOC", "I", "S"]
# A Raises section may name what a called function raises: the caller needs it too.
ignore = ["DOC502"]
# The DOC rules (pydoclint) are still in preview.
preview = true

[tool.ruff.lint.per-file-ignores]
# Docstrings are enforced on the package only. Tests assert, and use made-up tokens.
"tests/**" = ["D", "DOC", "S101", "S105", "S106"]
"evals/**" = ["D", "DOC"]
"docsgen/**" = ["D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
addopts = "--strict-markers --strict-config --cov=avenir_mcp --cov-branch --cov-report=term-missing --cov-fail-under=100"

# docsgen is a development tool, not in the package (only avenir_mcp ships): it may use
# the development dependency pyyaml, to read YNAB's specification.
[tool.deptry.per_rule_ignores]
DEP004 = ["yaml"]

# Mutation testing (`just mutate`): the modules that compute, against their own tests.
[tool.mutmut]
paths_to_mutate = ["avenir_mcp/"]
do_not_mutate = [
    "avenir_mcp/__init__.py",
    "avenir_mcp/__main__.py",
    "avenir_mcp/amounts.py",
    "avenir_mcp/app.py",
    "avenir_mcp/client.py",
    "avenir_mcp/confirm.py",
    "avenir_mcp/context.py",
    "avenir_mcp/http_auth.py",
    "avenir_mcp/journal.py",
    "avenir_mcp/logs.py",
    "avenir_mcp/model.py",
    "avenir_mcp/server.py",
    "avenir_mcp/tools_*.py",
]
also_copy = ["evals/"]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
tests_dir = [
    "tests/test_analytics.py",
    "tests/test_classifier.py",
    "tests/test_forecast.py",
    "tests/test_properties.py",
    "tests/test_reconcile.py",
    "tests/test_text.py",
    "tests/test_triage.py",
    "tests/test_writes.py",
]

[tool.coverage.run]
omit = ["avenir_mcp/__main__.py"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
