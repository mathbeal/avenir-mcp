# Evaluation reports (evals/run.py) and the changelog (git-cliff) stay as generated.
exclude: ^(evals/results/|CHANGELOG\.md$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Every tool runs as CI and the justfile run it: ruff and lexdrift from the
  # lockfile, typos, zizmor and pydoclint through uvx. Two versions of a tool give two verdicts.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint, imports, bandit)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      - id: lexdrift
        name: lexdrift
        entry: uvx lexdrift check avenir_mcp --baseline lexdrift.lock
        language: system
        types: [python]
        pass_filenames: false
      - id: typos
        name: typos
        entry: uvx typos .
        language: system
        pass_filenames: false
      - id: pydoclint
        name: pydoclint (docstrings match signatures)
        entry: uvx pydoclint==0.10.1 avenir_mcp
        language: system
        files: ^avenir_mcp/.*\.py$
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: uvx zizmor --persona=regular .github/workflows/
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
