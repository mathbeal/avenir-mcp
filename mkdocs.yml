site_name: Avenir
site_description: An MCP server for YNAB, built for agents.
site_url: https://mathbeal.github.io/avenir-mcp/
repo_url: https://github.com/mathbeal/avenir-mcp
repo_name: mathbeal/avenir-mcp
edit_uri: edit/main/docs/
copyright: MIT licence · Not affiliated with or endorsed by YNAB.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs, .]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

exclude_docs: |
  snippets/

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Your first conversation: getting-started/first-conversation.md
  - Use cases:
      - Classify pending transactions: use-cases/classify.md
      - Reconcile an account: use-cases/reconcile.md
      - Review a month: use-cases/monthly-review.md
      - Plan ahead: use-cases/plan-ahead.md
      - Add missing transactions: use-cases/missing-transactions.md
      - Organise categories: use-cases/categories.md
  - Concepts:
      - Safety by design: concepts/safety.md
      - How it works: concepts/how-it-works.md
  - Reference:
      - Tools, resources, prompts: reference/tools.md
      - Configuration: reference/configuration.md
  - Security: security.md
  - Evaluation: evaluation.md
  - Troubleshooting: troubleshooting.md
